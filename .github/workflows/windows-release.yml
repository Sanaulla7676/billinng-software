name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build -- --win --x64 --publish never --nosign

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist_electron/bundled -Recurse -File | Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' }
          if ($files.Count -eq 0) {
            Write-Error 'No Windows release artifacts were produced.'
            exit 1
          }
          $files | Select-Object FullName, Length

      - name: Create or update latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release delete-asset latest "SAAN Billing Software-v${{ github.run_number }}-windows-x64.exe" --yes 2>/dev/null || true
          else
            gh release create latest --title "SAAN Billing Software - Latest" --notes "Latest verified Windows build from main." --latest
          fi

      - name: Publish Windows installer assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest dist_electron/bundled/*.exe dist_electron/bundled/*.yml dist_electron/bundled/*.blockmap --clobber
