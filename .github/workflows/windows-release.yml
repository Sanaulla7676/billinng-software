name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows x64 installer (no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build -- --win --x64 --publish never --nosign

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist_electron/bundled -Recurse -File | Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' }
          if ($files.Count -eq 0) {
            Write-Error 'No Windows release artifacts were produced.'
            exit 1
          }
          $files | Select-Object FullName, Length

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $title = "SAAN Billing Software v$version"

          gh release view $tag | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist_electron/bundled/*.exe dist_electron/bundled/*.blockmap dist_electron/bundled/latest.yml --title $title --notes "Windows release for SAAN Billing Software v$version" --latest
          } else {
            gh release upload $tag dist_electron/bundled/*.exe dist_electron/bundled/*.blockmap dist_electron/bundled/latest.yml --clobber
            gh release edit $tag --title $title --latest
          }
